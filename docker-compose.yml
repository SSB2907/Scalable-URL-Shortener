services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: urluser
      POSTGRES_PASSWORD: urlpass
      POSTGRES_DB: urldb
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urluser -d urldb"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: applies db/migrations/*.sql, then exits. app/worker wait
  # for it to exit 0 rather than just waiting for postgres to accept
  # connections - "accepting connections" is not the same as "schema
  # exists" (this is the fresh-clone problem identified in the audit).
  migrate:
    build: .
    command: ["node", "db/migrate.js"]
    environment:
      DATABASE_URL: postgres://urluser:urlpass@postgres:5432/urldb
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    command: ["node", "src/server.js"]
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      BASE_URL: http://localhost:3000
      DATABASE_URL: postgres://urluser:urlpass@postgres:5432/urldb
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health/live',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: .
    command: ["node", "src/workers/analyticsWorker.js"]
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://urluser:urlpass@postgres:5432/urldb
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  dbdata:
