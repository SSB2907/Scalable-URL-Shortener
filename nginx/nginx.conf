# nginx/nginx.conf
#
# Used only by docker-compose.scale.yml (Phase 10) to demonstrate that the
# API is stateless and can run as multiple concurrent instances behind a
# load balancer. `app` resolves via Docker's embedded DNS to every replica
# started with `docker compose up --scale app=N`; nginx round-robins across
# whichever replicas are currently up.

events {
  worker_connections 1024;
}

http {
  upstream api_backend {
    server app:3000;
    server app2:3000;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://api_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
